# See https://pre-commit.com for configuration
repos:
  - repo: local
    hooks:
      - id: generate-card-thumbnails
        name: Generate card thumbnails (WebP 480px)
        entry: uv run python scripts/generate_card_thumbnails.py
        language: system
        files: ^images/(?!cards/)(?!hero/)(?!full/).*\.webp$|^scripts/generate_card_thumbnails\.py
        pass_filenames: false
      - id: generate-hero-images
        name: Generate optimized hero images (WebP 1600px)
        entry: uv run python scripts/generate_hero_images.py
        language: system
        files: ^images/(?!cards/)(?!hero/)(?!full/).*\.webp$|^scripts/generate_hero_images\.py
        pass_filenames: false
      - id: generate-full-images
        name: Generate full-resolution zoom images (WebP 2400px)
        entry: uv run python scripts/generate_full_images.py
        language: system
        files: ^images/(?!cards/)(?!hero/)(?!full/).*\.webp$|^scripts/generate_full_images\.py
        pass_filenames: false
      - id: generate-inline-small
        name: Generate small inline images (WebP 1000px)
        entry: uv run python scripts/generate_inline_small.py
        language: system
        files: ^images/[^/]+/.*\.full\.webp$|^scripts/generate_inline_small\.py
        pass_filenames: false
      - id: check-images
        name: Verify image variants + non-WebP references
        entry: uv run python scripts/check_images.py
        language: system
        files: ^(_recipes/|_components/|_layouts/|_includes/|assets/js/|images/|scripts/check_images\.py)
        pass_filenames: false
      - id: reject-non-webp-images
        name: Reject non-WebP files under images/
        entry: scripts/reject_non_webp.sh
        language: system
        files: ^images/
      - id: validate-seasonality
        name: Validate seasonality.yml against recipe_tags.yml
        entry: uv run python scripts/validate_seasonality.py
        language: system
        files: ^(_data/(recipe_tags|seasonality)\.yml|scripts/validate_seasonality\.py)$
        pass_filenames: false
      - id: build-tailwind
        name: Compile static Tailwind CSS
        entry: uv run python scripts/build_tailwind.py
        language: system
        files: |
          (?x)^(
            .*\.html|
            .*\.md|
            assets/js/.*\.js|
            assets/css/_tailwind\.css|
            tailwind\.config\.js|
            scripts/build_tailwind\.py
          )$
        pass_filenames: false
