# See https://pre-commit.com for configuration
repos:
  - repo: local
    hooks:
      - id: generate-card-thumbnails
        name: Generate card thumbnails
        entry: uv run python scripts/generate_card_thumbnails.py
        language: system
        files: ^images/(?!cards/)(?!hero/)|^scripts/generate_card_thumbnails\.py
      - id: generate-hero-images
        name: Generate optimized hero images (WebP 1600px)
        entry: uv run python scripts/generate_hero_images.py
        language: system
        files: ^images/(?!cards/)(?!hero/)|^scripts/generate_hero_images\.py
      - id: build-tailwind
        name: Compile static Tailwind CSS
        entry: uv run python scripts/build_tailwind.py
        language: system
        files: |
          (?x)^(
            .*\.html|
            .*\.md|
            assets/js/.*\.js|
            assets/css/_tailwind\.css|
            tailwind\.config\.js|
            scripts/build_tailwind\.py
          )$
        pass_filenames: false
