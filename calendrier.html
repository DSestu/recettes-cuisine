<style>
  /* Global CSS applies `overflow-x: hidden` on html/body which promotes them
     to scroll containers and breaks `position: sticky` against the viewport.
     `clip` visually clips overflow WITHOUT creating a scroll container, so
     the calendar's month header can stick to the viewport top on scroll. */

  html[data-page-kind="calendrier"] body {
    overflow-x: clip !important;
  }

     month header, same column as ingredient names). Persistent across
     re-renders (renderGantt preserves this element). */

    #calendrier-root { padding-bottom: 6rem; }
  }

  }
  .cal-ing-input-wrap {
    display: flex;

  }
  .cal-ing-input {

    border-radius: 0.4rem;
    transition: border-color 140ms ease-out, box-shadow 140ms ease-out;
  }
  .cal-ing-input:hover { border-color: rgb(254 215 170); }
  .cal-ing-input:focus {
    border-color: rgb(245 50 0 / 0.5);
    box-shadow: 0 0 0 2px rgb(245 50 0 / 0.12);

  .cal-ing-input::-webkit-search-cancel-button { display: none; }
  .cal-ing-input::placeholder { color: rgb(120 53 15 / 0.5); }

  .cal-ing-suggest {

  }
  #calendrier-now .now-toggle-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0.1rem;
    padding: 0.55rem 0.75rem;
    border-radius: 0.5rem;
    background: white;
    border: 1px solid rgb(254 215 170);
    min-width: 0;
  }
  /* Lifecycle palette (A) + directional gradient (D):
     - incoming = sage/spring green, gradient brightens toward the right
     - current  = warm sun gold, symmetric fill (peak)
     - leaving  = russet/rust, gradient brightens toward the left (fades right) */
  #calendrier-now .now-toggle-card[data-bucket="incoming"] {
    background: linear-gradient(90deg,
      white 0%,
      color-mix(in srgb, #65a30d 6%, white) 45%,
      color-mix(in srgb, #65a30d 22%, white) 100%);
    border-color: color-mix(in srgb, #65a30d 40%, white);
  }
  #calendrier-now .now-toggle-card[data-bucket="incoming"] .now-toggle-glyph {
    color: #65a30d;
  }
  #calendrier-now .now-toggle-card[data-bucket="current"] {
    background: linear-gradient(180deg,
      color-mix(in srgb, #f59e0b 12%, white) 0%,
      color-mix(in srgb, #f59e0b 20%, white) 100%);
    border-color: color-mix(in srgb, #f59e0b 55%, white);
  }
  #calendrier-now .now-toggle-card[data-bucket="current"] .now-toggle-glyph {
    color: #d97706;
  }
  #calendrier-now .now-toggle-card[data-bucket="leaving"] {
    background: linear-gradient(90deg,
      color-mix(in srgb, #a16207 22%, white) 0%,
      color-mix(in srgb, #a16207 6%, white) 55%,

  #calendrier-now .now-chip {

  }
  /* Directional gradient (cue #2): "start" chip brightens toward the right
     (energy incoming), "end" chip brightens toward the left (fading out). */
  #calendrier-now .now-chip[data-intensity="start"] {
    background: linear-gradient(90deg,
      white 0%,
      color-mix(in srgb, var(--cat-color) 8%, white) 35%,
      color-mix(in srgb, var(--cat-color) 45%, white) 100%);

  #calendrier-now .now-chip[data-intensity="end"] {
    background: linear-gradient(90deg,

      color-mix(in srgb, var(--cat-color) 8%, white) 65%,
      white 100%);

  #calendrier-now .now-chip-dot {
    position: relative;
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 999px;
    background: var(--cat-color);
    flex-shrink: 0;
    overflow: hidden;
  }
  /* Cue #1 — half-filled dot (waxing → full → waning). Cue #3 — hatch
     direction on the filled half (45° for start, −45° for end). */
  #calendrier-now .now-chip[data-intensity="start"] .now-chip-dot,
  #calendrier-now .now-chip[data-intensity="end"] .now-chip-dot {
    background: color-mix(in srgb, var(--cat-color) 20%, white);
    border: 1px solid var(--cat-color);
    width: 0.75rem;
    height: 0.75rem;

  #calendrier-now .now-chip[data-intensity="start"] .now-chip-dot::before,
  #calendrier-now .now-chip[data-intensity="end"] .now-chip-dot::before {
    content: "";

    top: 0;
    bottom: 0;
    width: 50%;

        var(--cat-color) 1.5px 3px);

  #calendrier-now .now-chip[data-intensity="end"] .now-chip-dot::before {
