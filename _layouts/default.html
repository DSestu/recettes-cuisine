<!DOCTYPE html>
<html class="h-full">
  {% include head.html %}

  <style>
    @media (max-width: 767px) {
      #btn-page-fullscreen.btn-hidden,
      #btn-qr-modal.btn-hidden {
        opacity: 0;
        transform: translateY(-140%);
      }
    }
    @media (min-width: 768px) {
      #btn-page-fullscreen,
      #btn-qr-modal {
        display: none;
      }
    }

    #qr-modal {
      z-index: 9999; /* ensure overlay is above recipe content and image */
    }

    #qr-modal.qr-modal-open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>

  <body
    class="flex min-h-screen w-full font-inter bg-orange-50 text-orange-950"
  >
    <main class="relative flex-1 w-full">
      <!-- Global fullscreen toggle (appears like back button) -->
      <a
        id="btn-page-fullscreen"
        href="#"
        class="fixed top-4 right-4 z-30 bg-white rounded-full p-3 md:p-4 shadow border border-gray-200 hover:bg-gray-50 transition-all duration-300 ease-out"
        title="Plein écran"
        aria-label="Plein écran"
      >
        <svg
          id="icon-fs-enter"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-6 md:size-8"
        >
          <path
            d="M3 9V5a2 2 0 0 1 2-2h4a1 1 0 1 1 0 2H6a1 1 0 0 0-1 1v3a1 1 0 1 1-2 0m0 10v-4a1 1 0 1 1 2 0v3a1 1 0 0 0 1 1h3a1 1 0 1 1 0 2H5a2 2 0 0 1-2-2M21 9V6a1 1 0 0 0-1-1h-3a1 1 0 1 1 0-2h4a2 2 0 0 1 2 2v4a1 1 0 1 1-2 0m-7 12a1 1 0 1 1 0-2h3a1 1 0 0 0 1-1v-3a1 1 0 1 1 2 0v4a2 2 0 0 1-2 2Z"
          />
        </svg>
        <svg
          id="icon-fs-exit"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="hidden size-6 md:size-8"
        >
          <path
            d="M6.225 4.811a1 1 0 1 0-1.414 1.414L9.586 11H6a1 1 0 1 0 0 2h6V7a1 1 0 1 0-2 0v3.586zM17.775 19.189a1 1 0 1 0 1.414-1.414L14.414 13H18a1 1 0 1 0 0-2h-6v6a1 1 0 1 0 2 0v-3.586z"
          />
        </svg>
      </a>
      <button
        id="btn-qr-modal"
        type="button"
        class="fixed top-4 right-20 z-30 bg-white rounded-full p-3 md:p-4 shadow border border-gray-200 hover:bg-gray-50 transition-all duration-300 ease-out"
        title="Afficher le QR code"
        aria-label="Afficher le QR code"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-6 md:size-8"
        >
          <path
            d="M3 3h4v4H3V3zm2 2v0h0zm6-2h4v4h-4V3zm2 2v0h0zM3 11h4v4H3v-4zm2 2v0h0zm8-2h4v2h-2v2h2v2h-4v-6zm-4 0h2v2h-2v-2zm0 4h2v2h-2v-2zm8-4h2v2h-2v-2zm0 4h2v4h-4v-2h2v-2z"
          />
        </svg>
      </button>
      <button
        id="toggle-sidebar"
        class="hidden md:block absolute top-4 left-4 z-20 bg-white border border-gray-300 rounded-lg p-2 shadow hover:bg-gray-50"
        title="Afficher/masquer le menu"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-5"
        >
          <path
            fill-rule="evenodd"
            d="M3.75 5.25a.75.75 0 0 1 .75-.75h15a.75.75 0 0 1 0 1.5h-15a.75.75 0 0 1-.75-.75Zm0 6a.75.75 0 0 1 .75-.75h15a.75.75 0 0 1 0 1.5h-15a.75.75 0 0 1-.75-.75Zm0 6a.75.75 0 0 1 .75-.75h15a.75.75 0 0 1 0 1.5h-15a.75.75 0 0 1-.75-.75Z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
      {{ content }}
    </main>

    {% unless page.permalink == '/recherche/' or page.url == '/recherche/' %}
    <a
      href="{{ site.baseurl }}/recherche/"
      class="fixed bottom-5 right-5 bg-primary text-white rounded-full p-4 shadow-lg hover:scale-105 hover:rotate-3 transition"
      title="Recherche avancée"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-7"
      >
        <path
          fill-rule="evenodd"
          d="M10.5 3.75a6.75 6.75 0 1 0 4.2 12.06l3.245 3.245a.75.75 0 1 0 1.06-1.06l-3.245-3.245A6.75 6.75 0 0 0 10.5 3.75ZM5.25 10.5a5.25 5.25 0 1 1 10.5 0 5.25 5.25 0 0 1-10.5 0Z"
          clip-rule="evenodd"
        />
      </svg>
    </a>
    {% endunless %}

    <div
      id="qr-modal"
      class="fixed inset-0 z-40 flex items-center justify-center bg-black/60 opacity-0 pointer-events-none transition-opacity duration-200"
      aria-hidden="true"
    >
      <div
        data-qr-modal-panel
        class="relative bg-white rounded-2xl p-4 md:p-6 shadow-3xl w-[95%] md:w-[80%] max-w-3xl max-h-[90vh] flex flex-col items-center gap-4"
      >
        <button
          type="button"
          data-qr-modal-close
          class="absolute top-3 right-3 inline-flex items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 hover:text-gray-700 hover:bg-gray-50 w-8 h-8 md:w-9 md:h-9 shadow-sm"
          aria-label="Fermer le QR code"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-4 h-4 md:w-5 md:h-5"
          >
            <path
              fill-rule="evenodd"
              d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
        <h2 class="text-lg font-semibold text-center text-orange-950">
          Scanner ce QR code pour accéder au site
        </h2>
        <div
          id="modal-qr"
          class="w-full max-h-[80vh] aspect-square rounded-xl border border-gray-200 bg-white overflow-hidden flex items-center justify-center"
        ></div>
        <noscript>
          <img
            src="{{ site.baseurl }}/qr-code.jpg"
            alt="QR code vers Recettes Cuisine"
            class="w-full h-auto max-h-[70vh] object-contain rounded-xl border border-gray-200 bg-white"
            loading="lazy"
          />
        </noscript>
      </div>
    </div>

    <script>
      (function () {
        const btn = document.getElementById("toggle-sidebar");
        const nav =
          document.querySelector("nav.mobile-nav") ||
          document.querySelector("body > nav");
        if (!btn || !nav) return;
        btn.addEventListener("click", () => {
          const isDesktop = window.matchMedia("(min-width: 768px)").matches;
          if (isDesktop) {
            // Override Tailwind md:hidden via inline style
            const visible = window.getComputedStyle(nav).display !== "none";
            nav.style.display = visible ? "none" : "block";
            return;
          }
          // Mobile (button is hidden anyway), keep class-based toggle for completeness
          const isHidden = nav.classList.contains("hidden");
          nav.classList.toggle("hidden", !isHidden);
        });
        // On resize to mobile, clear inline overrides so mobile behavior works
        window.addEventListener("resize", () => {
          const isDesktop = window.matchMedia("(min-width: 768px)").matches;
          if (!isDesktop) nav.style.display = "";
        });
      })();
    </script>
    <script>
      // Global Page Fullscreen + Wake Lock + scrolling retained
      (function () {
        const fsBtn = document.getElementById("btn-page-fullscreen");
        if (!fsBtn) return;
        const iconEnter = document.getElementById("icon-fs-enter");
        const iconExit = document.getElementById("icon-fs-exit");
        let wakeLock = null;
        function isFs() {
          return !!document.fullscreenElement;
        }
        async function requestWakeLock() {
          try {
            if ("wakeLock" in navigator)
              wakeLock = await navigator.wakeLock.request("screen");
          } catch (_) {}
        }
        async function releaseWakeLock() {
          try {
            if (wakeLock && wakeLock.release) await wakeLock.release();
          } catch (_) {
          } finally {
            wakeLock = null;
          }
        }
        function enterFs() {
          const el = document.documentElement;
          const req =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.msRequestFullscreen;
          if (req) req.call(el);
          // Keep scrolling enabled; avoid forcing overflow hidden
          document.body.style.overscrollBehaviorY = "none";
          requestWakeLock();
        }
        function exitFs() {
          const ex =
            document.exitFullscreen ||
            document.webkitExitFullscreen ||
            document.msExitFullscreen;
          if (ex) ex.call(document);
          document.body.style.overscrollBehaviorY = "";
          releaseWakeLock();
        }
        function updateBtn() {
          const fs = isFs();
          if (fs) {
            iconEnter.classList.add("hidden");
            iconExit.classList.remove("hidden");
            fsBtn.title = "Quitter le plein écran";
            fsBtn.setAttribute("aria-label", "Quitter le plein écran");
          } else {
            iconExit.classList.add("hidden");
            iconEnter.classList.remove("hidden");
            fsBtn.title = "Plein écran";
            fsBtn.setAttribute("aria-label", "Plein écran");
          }
        }
        fsBtn.addEventListener("click", (e) => {
          e.preventDefault();
          isFs() ? exitFs() : enterFs();
        });
        document.addEventListener("fullscreenchange", updateBtn);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible" && isFs())
            requestWakeLock();
        });
        updateBtn();
      })();
    </script>
    <script>
      // QR modal open/close behavior
      (function () {
        const modal = document.getElementById("qr-modal");
        if (!modal) return;
        const modalCloseButtons =
          modal.querySelectorAll("[data-qr-modal-close]");

        function openModal() {
          modal.classList.add("qr-modal-open");
          document.documentElement.style.overflow = "hidden";
          modal.setAttribute("aria-hidden", "false");
        }

        function closeModal() {
          modal.classList.remove("qr-modal-open");
          document.documentElement.style.overflow = "";
          modal.setAttribute("aria-hidden", "true");
        }

        ["btn-qr-modal", "btn-qr-modal-desktop"].forEach((id) => {
          const btn = document.getElementById(id);
          if (!btn) return;
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            openModal();
          });
        });

        modal.addEventListener("click", (e) => {
          if (e.target === modal) {
            closeModal();
          }
        });

        modalCloseButtons.forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            closeModal();
          });
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && modal.classList.contains("qr-modal-open")) {
            closeModal();
          }
        });
      })();
    </script>
    <script>
      // Dynamic QR generation for desktop sidebar and mobile modal
      (function () {
        function initQr() {
          if (typeof QRCode === "undefined") return;
          var url = window.location.href || document.location.href;

          try {
            var desktopEl = document.getElementById("desktop-qr");
            if (desktopEl && !desktopEl.dataset.qrGenerated) {
              var dSize = Math.floor(
                Math.min(
                  desktopEl.clientWidth || 0,
                  desktopEl.clientHeight || 0
                ) * 0.9
              );
              if (!dSize || !Number.isFinite(dSize)) dSize = 240;
              new QRCode(desktopEl, {
                text: url,
                width: dSize,
                height: dSize,
              });
              desktopEl.dataset.qrGenerated = "1";
            }
          } catch (e) {
            // ignore
          }

          try {
            var modalEl = document.getElementById("modal-qr");
            if (modalEl && !modalEl.dataset.qrGenerated) {
              var mSize = Math.floor(
                Math.min(
                  modalEl.clientWidth || 0,
                  modalEl.clientHeight || 0
                ) * 0.9
              );
              if (!mSize || !Number.isFinite(mSize)) mSize = 320;
              new QRCode(modalEl, {
                text: url,
                width: mSize,
                height: mSize,
              });
              modalEl.dataset.qrGenerated = "1";
            }
          } catch (e) {
            // ignore
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initQr, { once: true });
        } else {
          initQr();
        }
      })();
    </script>
    <script>
      // Mobile hide/show for top-right buttons (fullscreen + QR)
      (function () {
        const fsBtn = document.getElementById("btn-page-fullscreen");
        const qrBtn = document.getElementById("btn-qr-modal");
        if (!fsBtn && !qrBtn) return;
        let lastY = window.scrollY || 0;

        function setHidden(hidden) {
          [fsBtn, qrBtn].forEach((btn) => {
            if (!btn) return;
            if (hidden) {
              btn.classList.add("btn-hidden");
            } else {
              btn.classList.remove("btn-hidden");
            }
          });
        }

        window.addEventListener(
          "scroll",
          () => {
            const isMobile = window.matchMedia("(max-width: 767px)").matches;
            if (!isMobile) return;
            const y = window.scrollY || 0;
            const goingDown = y > lastY && y > 6;
            const atTop = y <= 0;
            if (goingDown) setHidden(true);
            if (atTop || y < lastY) setHidden(false);
            lastY = y;
          },
          { passive: true }
        );
      })();
    </script>
  </body>
</html>
