        top: 0;
        bottom: 0;

        --desktop-strip-intensity: 0;

          rgba(0, 0, 0, calc(0.42 * var(--desktop-strip-intensity))) 0%,

        transition: opacity 0.2s ease;
        z-index: 9990;
        opacity: 0;
        pointer-events: none;
      }
      #desktop-edge-strip.desktop-edge-strip--visible {
        opacity: 1;
        pointer-events: auto;
      }

        opacity: 0;
        pointer-events: none;
      }

        left: 0;

  <script>
    document.addEventListener("keydown", function (e) {
      if (!(e.key === "f" || e.key === "F")) return;
      if (!(e.ctrlKey || e.metaKey)) return;
      if (e.altKey || e.shiftKey) return;
      const input =
        document.getElementById("tag-input") ||
        document.getElementById("home-search") ||
        document.getElementById("title-search");
      if (!input) return;
      e.preventDefault();
      try {
        input.focus({ preventScroll: true });
      } catch (_) {
        input.focus();
      }
      if (typeof input.select === "function") input.select();
      input.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  </script>

  <!-- Speculation Rules: prefetch same-origin pages on hover/touch.
       Warms the HTTP cache so View Transitions don't pause as long waiting
       on the destination HTML. Does NOT prerender (prerender activation can
       bypass cross-document View Transitions in some Chrome versions).
       Other browsers ignore the script harmlessly. -->
  <script type="speculationrules">
    {
      "prefetch": [
        {
          "where": {
            "and": [
              { "href_matches": "/*" },
              { "not": { "href_matches": "/*.xml" } },
              { "not": { "href_matches": "/*.json" } },
              { "not": { "selector_matches": "[target='_blank']" } },
              { "not": { "selector_matches": "[rel~='external']" } }
            ]
          },
          "eagerness": "moderate"
        }
      ]
    }
  </script>

            scope: "./",
          })
          .then(function (reg) {
            console.log(
              "Service worker has been registered for scope: " + reg.scope
            );
          });
      }
    }
  </script>
