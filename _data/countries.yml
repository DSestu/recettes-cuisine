# Country / region names usable in recipe `country:` frontmatter, mapped to a
# flag file `assets/flags/<flag>.svg` (ISO 3166-1 alpha-2 codes from the
# flag-icons project, 4x3 ratio). Match is on the exact `name` string.
#
# Regions / special values:
#   - "Antilles" uses the Martinique flag (Guadeloupe has no distinct flag).
#   - "Fusion" uses a neutral globe icon (assets/flags/fusion.svg).
#   - Sub-national cuisines (Corse, Bretagne, Réunion, Écosse, Catalogne, …)
#     map to the flag available in the set.

